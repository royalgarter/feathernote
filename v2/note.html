<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="note ? `Edit Note: ${note.title}` : 'New Note'">New Note</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AlpineJS CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-100" x-data="{ ...app(), ...auth(), ...noteManager(), ...noteEditor() }" x-init="initApp(); initNotePage()">
    <!-- AppShellHeader (simplified for note page) -->
    <header class="sticky top-0 z-40 w-full border-b bg-white/80 backdrop-blur-sm">
        <div class="container mx-auto flex h-16 items-center justify-between p-4">
            <a href="/" class="flex items-center gap-2">
                <!-- FeatherIcon Placeholder -->
                <div class="h-6 w-6 text-blue-500">Icon</div>
                <span class="font-bold text-lg font-sans text-gray-900">FeatherNote</span>
            </a>
            <div class="flex items-center gap-4">
                <!-- UserProfile -->
                <div x-data="{ auth: $root.auth }">
                    <template x-if="auth && auth.user">
                        <div class="flex items-center gap-2">
                            <img :src="auth.user.picture" alt="User Picture" class="h-8 w-8 rounded-full" />
                            <button @click="auth.signOut()" class="px-3 py-1 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">Sign Out</button>
                        </div>
                    </template>
                    <template x-if="auth && !auth.user">
                        <button @click="auth.signIn()" class="px-3 py-1 rounded-md bg-blue-600 text-white hover:bg-blue-700">Sign In</button>
                    </template>
                </div>
            </div>
        </div>
    </header>

    <!-- Note Editing Content -->
    <main class="flex-1 overflow-y-auto max-w-4xl mx-auto py-6 sm:px-6 lg:px-8 w-full">
        <div class="px-4 py-6 sm:px-0 bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-4" x-text="noteId ? 'Edit Note' : 'Create New Note'"></h2>
            <div x-data="noteEditor()" x-init="initEditor()">
                <div class="mb-4">
                    <label for="note-title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="note-title" x-model="title" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="Note Title" />
                </div>
                <div class="mb-4">
                    <label for="note-content" class="block text-sm font-medium text-gray-700">Content</label>
                    <textarea id="note-content" x-model="content" rows="15" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="Note Content"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button @click="saveNote()" class="px-4 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700">Save Note</button>
                    <button @click="cancelEdit()" class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toasts Container -->
    <div class="fixed bottom-4 right-4 z-[100] flex flex-col space-y-2">
        <template x-for="toast in toasts" :key="toast.id">
            <div
                x-show="toast.show"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-full"
                x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0"
                x-transition:leave-end="opacity-0 translate-y-full"
                :class="{
                    'bg-white border border-gray-200 text-gray-900': toast.variant === 'default',
                    'bg-red-600 border border-red-700 text-white': toast.variant === 'destructive'
                }"
                class="relative w-full max-w-xs p-4 rounded-md shadow-lg flex items-center justify-between"
            >
                <div>
                    <h4 class="font-semibold" x-text="toast.title"></h4>
                    <p class="text-sm" x-text="toast.description"></p>
                </div>
                <button @click="dismissToast(toast.id)" class="absolute top-1 right-1 p-1 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <script src="index.js"></script>
</body>
</html>
