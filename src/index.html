<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FeatherNote</title>
	<meta name="description" content="FeatherNote: A featherweight, offline-first PWA for note-taking with Markdown, S3 Sync, and Share Target API. Your notes, your cloud, your control.">
	<meta name="keywords" content="note taking, pwa, offline-first, markdown, s3 sync, privacy, open source, javascript, nostr, decentralized">
	<meta name="author" content="royalgarter">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://feathernote.royalgarter.deno.net">
	<meta property="og:title" content="FeatherNote: Featherweight PWA, Private Note-Taking">
	<meta property="og:description" content="FeatherNote: A featherweight, offline-first PWA for note-taking with Markdown, S3 Sync, and Share Target API. Your notes, your cloud, your control.">
	<meta property="og:image" content="https://feathernote.royalgarter.deno.net/icons/ios/512.png">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="https://feathernote.royalgarter.deno.net">
	<meta property="twitter:title" content="FeatherNote: Featherweight PWA, Private Note-Taking">
	<meta property="twitter:description" content="FeatherNote: A featherweight, offline-first PWA for note-taking with Markdown, S3 Sync, and Share Target API. Your notes, your cloud, your control.">
	<meta property="twitter:image" content="https://feathernote.royalgarter.deno.net/icons/ios/512.png">

	<link rel="apple-touch-icon" sizes="180x180" href="/icons/ios/180.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/icons/ios/32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/icons/ios/16.png">
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#A2D2FF">
	<meta name="GOOGLE_CLIENT_ID" content="___GOOGLE_CLIENT_ID___">
	<meta name="VERSION" content="___VERSION___">

	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
	<link rel="preconnect" href="https://maxcdn.bootstrapcdn.com" crossorigin>
</head>
<body id="main-app" class="flex flex-col min-h-screen" :class="{'dark': darkMode, '': !darkMode}" x-data="mainApp()" x-init="init()">
	<!-- Biometric Lock Overlay -->
	<div x-show="isLocked"
		 x-transition:enter="transition ease-out duration-300"
		 x-transition:enter-start="opacity-0"
		 x-transition:enter-end="opacity-100"
		 class="fixed w-full h-full inset-0 z-10 flex flex-col items-center justify-center bg-white dark:bg-gray-900 p-4 text-center"
		 style="display: none;color:#A2D2FF;"
	>
		<img src="/icons/ios/128.png" alt="FeatherNote Logo" class="w-24 h-24 mb-6">
		<h1 class="text-2xl font-bold mb-2">FeatherNote Locked</h1>
		<p class="mb-8 max-w-xs text-sm">Authentication required to access your notes.</p>
		<button @click="unlockApp()" class="w-full max-w-xs text-3xl border py-4 font-bold flex items-center justify-center gap-2">
			Unlock App
		</button>
	</div>
	<!-- AppShellHeader -->
	<header class="sticky top-0 w-full border-b bg-white z-20">
		<div class="container flex h-16 items-center justify-between py-2 w-full mx-auto px-4">
			<a href="#" class="flex items-center gap-2">
				<!-- FeatherIcon Placeholder -->
				<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24" viewBox="0 0 1115 1115">
					<path fill-rule="evenodd" stroke="#A2D2FF" stroke-width="48.35px" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M678.345,436.489 L248.424,866.410 "/>
					<path fill-rule="evenodd" stroke="#A2D2FF" stroke-width="48.35px" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M345.298,769.537 L338.934,514.271 L563.794,289.411 C563.794,289.411 705.043,190.244 813.402,298.603 C921.761,406.962 828.853,553.268 828.853,553.268 L603.391,778.729 L345.298,769.537 Z"/>
					<path fill-rule="evenodd" stroke="#A2D2FF" stroke-width="48.35px" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M720.771,652.864 L477.460,652.864 "/>
					<path fill-rule="evenodd" stroke="#A2D2FF" stroke-width="48.35px" stroke-linecap="butt" stroke-linejoin="miter" fill="none" d="M351.175,24.175 L763.175,24.175 C943.772,24.175 1090.175,170.578 1090.175,351.175 L1090.175,763.175 C1090.175,943.772 943.772,1090.175 763.175,1090.175 L351.175,1090.175 C170.578,1090.175 24.175,943.772 24.175,763.175 L24.175,351.175 C24.175,170.578 170.578,24.175 351.175,24.175 Z"/>
				</svg>

				<div class="font-bold text-lg font-sans hidden md:inline-block" style="color:#A2D2FF;"
					x-show="!syncStatusMessage && !isSyncing">
					<span>FeatherNote</span><span class="text-xs font-semibold" x-text="' #' + appVersion"></span>
				</div>
			</a>
			<div class="flex items-center gap-4">
				<!-- SyncStatus -->
				<div>
					<template x-if="syncStatusMessage || isSyncing">
						<span class="text-xs" x-text="syncStatusMessage || isSyncing"></span>
					</template>
				</div>
				<!-- SettingsDialog Trigger -->
				<button @click="loadSettingsFromStorage();settingsDialogIsOpen = true" class="cursor-pointer p-1" aria-label="Settings">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
						<path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
						<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
					</svg>
				</button>
				<!-- UserProfile -->
				<div class="cursor-pointer p-1">
					<template x-if="user">
						<div @click="signOut()" class="flex items-center gap-2">
							<template x-if="user.picture">
								<img :src="user.picture" alt="User Picture" class="h-6 w-6" />
							</template>
							<template x-if="!user.picture">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6">
									<path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
								</svg>
							</template>
						</div>
					</template>
					<template x-if="!user">
						<div @click="signIn()" class="flex items-center gap-2">
							<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
								<path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
							</svg>
						</div>
					</template>
				</div>
			</div>
		</div>
	</header>

	<!-- AppShellContent -->
	<main class="flex-1 w-full"
		:class="{ 'cursor-wait': isManualSyncing, 'max-w-max mx-auto': editingNoteId === null }"
	>
		<!-- Search Box & Add Note -->
		<template x-if="editingNoteId === null">
			<div id="search" class="flex justify-between items-center px-4 pt-6 pb-2 gap-4">
				<div class="relative w-full max-w-xs">
					<input type="text" id="searchInput" x-model="searchTag" @input.debounce.500ms="filteredNotes" @focus="generateSuggestions()" @blur.debounce.300ms="suggestions = []" class="cursor-text w-full border py-2 px-4" :placeholder="'Search ' + (notes.length || '') + ' notes...'"/>
					<div x-show="suggestions.length > 0" class="absolute z-10 w-full bg-white border max-h-60 overflow-y-auto">
						<template x-for="suggestion in suggestions" :key="suggestion.id">
							<div @click="searchTag = suggestion.suggestion; suggestions = []" class="px-4 py-2 cursor-pointer hover:underline">
								<span x-text="suggestion.suggestion"></span>
							</div>
						</template>
					</div>
				</div>
				<button @click="createNewNote()" class="cursor-pointer font-bold p-2 w-32 border">Compose</button>
			</div>
		</template>

		<!-- Welcome -->
		<div id="welcome-section" x-show="editingNoteId === null && notes.length === 0" class="py-4 px-6 my-4 w-full" style="display: block;">
			<!--WELCOME_CONTENT-->
		</div>

		<!-- Note Editor View -->
		<template x-if="editingNoteId !== null">
			<div id="note-editor" class="p-4" style="height: 100vh;max-height: calc(100vh - 4.1rem);">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-lg font-semibold" x-text="noteEditorNoteId ? ('Editing: #' + noteEditorNoteId) : 'New Note'"></h3>
					<button @click="(noteEditorContent != window.easyMDEInstance?.value()) && saveNote(); cancelEdit();" class="cursor-pointer" aria-label="Close">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
					</button>
				</div>
				<div class="mb-4">
					<input type="text" id="note-title" x-model="noteEditorTitle" class="block w-full border p-2" :readonly="noteEditorTitle == 'Shared Inbox'" placeholder="Note Title" />
				</div>
				<div class="mb-4">
					<div x-show="!noteEditorVisible && easyMDEIniting" class="w-full border p-4">
						<p>Loading editor...</p>
					</div>
					<textarea id="note-content" x-model="noteEditorContent" rows="15" class="mt-1 block w-full border p-2" placeholder="The palest ink is better than the best memory"></textarea>
				</div>
				<div class="mb-4">
					<label for="note-tags" class="block text-sm font-medium">Tags (comma-separated)</label>
					<input type="text" id="note-tags" x-model="noteEditorTags" class="mt-1 block w-full border p-2" placeholder="e.g. work, personal, ideas" />
				</div>
			<div class="mb-4 pb-4">
				<label for="note-reminder" class="block text-sm font-medium">Reminder Date/Time (Optional)</label>
				<input type="datetime-local" id="note-reminder" x-model="noteEditorReminder" class="cursor-pointer mt-1 block w-full border p-2" />
			</div>
			<div class="mb-4 pb-4 flex items-center gap-2">
				<input type="checkbox" id="note-body-encoded" x-model="noteEditorBodyEncoded" class="cursor-pointer" />
				<label for="note-body-encoded" class="text-sm font-medium cursor-pointer">Base64 encode body in Git storage (hide from plain view)</label>
			</div>
				<!-- <div class="flex justify-end gap-2">
					<button @click="cancelEdit()" class="cursor-pointer border px-4 py-2">Cancel</button>
					<button @click="deleteNote(noteEditorNoteId)" class="cursor-pointer border px-4 py-2 font-bold">Delete</button>
					<button @click="shareNote()" class="cursor-pointer border px-4 py-2">Share</button>
					<button @click="saveNote()" class="cursor-pointer border px-4 py-2 font-bold">Save</button>
				</div> -->
			</div>
		</template>

		<!-- Notes List View -->
		<template x-if="editingNoteId === null">
			<div id="notes-list" class="px-4 py-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
				<template x-for="note in paginatedNotes" :key="note.id">
					<div class="flex flex-col justify-between border p-4 h-full cursor-pointer"
						:style="{ 'border-color': getNoteColor(note) }"
						@click="editNote(note.id)"
					>
						<div class="flex-grow min-w-0">
							<div class="flex justify-between items-baseline mb-2">
								<span class="text-xs italic" x-text="formatDate(note.updatedAt)"></span>
								<span class="text-xs font-bold" x-show="note.priority" x-text="'P:' + note.priority"></span>
							</div>
							<h4 class="text-base font-bold truncate mb-2" :style="{ 'color': getNoteColor(note) }" x-text="note.title"></h4>
							<p class="text-sm line-clamp-5 break-all" x-text="getNotePreview(note.content)"></p>
						</div>

						<div class="mt-4 pt-2 border-t flex flex-col gap-2">
							<div class="flex flex-wrap gap-1">
								<template x-for="tag in note.tags.filter(x=>x)" :key="tag">
									<span @click.stop="searchTag=tag;" class="text-xs hover:underline" x-text="'#'+tag"></span>
								</template>
							</div>
							<div class="flex justify-between items-center">
								<div class="flex gap-1">
									<button @click.stop="increasePriority(note.id)" class="cursor-pointer border px-1 text-xs" title="Increase Priority">▲</button>
									<button @click.stop="decreasePriority(note.id)" class="cursor-pointer border px-1 text-xs" title="Decrease Priority">▼</button>
								</div>
								<button class="cursor-pointer font-bold text-xs underline" @click.stop="deleteNote(note.id); $dispatch('close-delete-modal')">Del</button>
							</div>
						</div>
					</div>
				</template>
			</div>
			<!-- Pagination Controls -->
			<div class="flex justify-center items-center gap-4 mt-4">
				<button @click="prevPage()" :disabled="currentPage === 1" class="cursor-pointer border px-2 py-1 disabled:opacity-50">Previous</button>
				<span x-text="'Page ' + currentPage + ' of ' + totalPages"></span>
				<button @click="nextPage()" :disabled="currentPage === totalPages" class="cursor-pointer border px-2 py-1 disabled:opacity-50">Next</button>
			</div>
		</template>

		<!-- Loading State -->
		<template x-if="!notes.length && loading">
			<div class="w-full p-8 border border-dashed flex items-center justify-center">
				<p class="text-lg">Loading notes...</p>
			</div>
		</template>

		<!-- Delete Confirmation Modal -->
		<div x-data="{ showModal: false, noteToDelete: null }"
			 @open-delete-modal.window="showModal = true; noteToDelete = $event.detail"
			 @close-delete-modal.window="showModal = false"
			 x-show="showModal"
			 class="fixed inset-0 z-40 bg-black bg-opacity-50 flex items-center justify-center"
			 style="display: none;"
		>
			<div class="bg-white p-6 border max-w-sm mx-auto"
				 @click.away="showModal = false"
			>
				<h3 class="text-lg font-bold mb-4">Confirm Delete</h3>
				<p class="text-sm mb-6">
					Delete "<span x-text="noteToDelete ? noteToDelete.title : ''"></span>"? This cannot be undone.
				</p>
				<div class="flex justify-end gap-4">
					<button @click="showModal = false" class="cursor-pointer border px-4 py-2">Cancel</button>
					<button @click="deleteNote(noteToDelete.id); showModal = false;" class="cursor-pointer border px-4 py-2 font-bold">Delete</button>
				</div>
			</div>
		</div>
	</main>

	<!-- Settings Dialog -->
	<div x-show="settingsDialogIsOpen"
		 class="fixed inset-0 pt-12 z-10 w-full h-full flex items-center justify-center"
		 style="display: none; background-color: rgba(0,0,0,0.5);"
	>
		<div class="bg-white p-6 border w-full max-w-4xl max-h-full overflow-y-auto"
			 @click.away="settingsDialogIsOpen = false"
		>
			<div class="flex justify-between items-center pb-2">
				<div class="flex items-baseline gap-4">
					<h3 class="text-lg font-bold">Settings <span class="text-sm" x-text="'v.'+appVersion"></span></h3>
					<a href="/about" target="_blank" class="text-sm underline">About</a>
					<a href="https://github.com/royalgarter/feathernote" target="_blank" class="text-sm underline">Repo</a>
				</div>
				<button @click="settingsDialogIsOpen = false" class="cursor-pointer" aria-label="Close">
					[Close]
				</button>
			</div>

			<div class="grid lg:grid-cols-2 gap-4 py-2">
				<div class="col-span-2 border-t pt-4">
					<!-- Bookmarklet -->
					<div class="flex items-center py-1 justify-between">
						<p class="text-sm">Browser Bookmarklet</p>
						<a :href="bookmarkletUrl" class="cursor-pointer border px-2 py-1" style="color:#A2D2FF;" @click.prevent="alert('Drag this link to your bookmarks bar!')">ℱ</a>
					</div>
					<!-- Dark Mode Toggle -->
					<div class="flex items-center py-1 justify-between">
						<p class="text-sm">Dark Mode</p>
						<button @click="toggleDarkMode()" class="cursor-pointer border px-2 py-1" x-text="darkMode ? 'Disable' : 'Enable'"></button>
					</div>
					<!-- Notification Settings -->
					<div class="flex items-center py-1 justify-between">
						<p class="text-sm">Reminder Notifications</p>
						<button @click="togglePushNotifications()" class="cursor-pointer border px-2 py-1" x-text="notificationsEnabled ? 'Disable' : 'Enable'"></button>
					</div>
					<!-- Google Drive -->
					<div class="flex items-center py-1 justify-between">
						<p class="text-sm">Google Drive</p>
						<div class="flex gap-2 items-center">
							<template x-if="!gdriveStore.connected">
								<button @click="signInToGoogleDrive()" class="cursor-pointer border px-2 py-1 text-sm">Connect</button>
							</template>
							<template x-if="gdriveStore.connected">
								<div class="flex items-center gap-2">
									<span class="text-xs" x-text="gdriveStore.user?.email"></span>
									<button class="cursor-pointer border px-2 py-1 text-sm" @click="signOutFromGoogleDrive()">Disconnect</button>
								</div>
							</template>
						</div>
					</div>
					<!-- Biometric Lock -->
					<div class="flex items-center py-1 justify-between">
						<p class="text-sm">Biometric Lock</p>
						<button @click="toggleBiometric()" class="cursor-pointer border px-2 py-1" x-text="biometricEnabled ? 'Disable' : 'Enable'"></button>
					</div>
				</div>

				<fieldset class="col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm" >
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="s3-region" class="text-right">S3 Region</label>
						<input id="s3-region" x-model="s3Region" class="col-span-3 border p-1" placeholder="us-east-1" autocomplete="off" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="s3-bucket" class="text-right">S3 Bucket</label>
						<input id="s3-bucket" x-model="s3Bucket" class="col-span-3 border p-1" placeholder="bucket-name" autocomplete="off" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="s3-subfolder" class="text-right">S3 Subfolder</label>
						<input id="s3-subfolder" x-model="s3Subfolder" class="col-span-3 border p-1" placeholder="notes/" autocomplete="off" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="s3-endpoint" class="text-right">S3 Endpoint</label>
						<input id="s3-endpoint" x-model="s3Endpoint" class="col-span-3 border p-1" placeholder="https://..." autocomplete="url" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="access-key" class="text-right">Access Key</label>
						<input id="access-key" x-model="accessKeyId" class="col-span-3 border p-1" autocomplete="off" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="secret-key" class="text-right">Secret Key</label>
						<input id="secret-key" type="password" x-model="secretAccessKey" class="col-span-3 border p-1" autocomplete="new-password" />
					</div>
				</fieldset>

				<fieldset class="col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm">
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="git-repo-url" class="text-right text-sm">Git Repo URL</label>
						<input id="git-repo-url" x-model="gitRepoUrl" class="col-span-3 border p-1" placeholder="https://..." autocomplete="url" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="git-branch" class="text-right text-sm">Branch</label>
						<input id="git-branch" x-model="gitBranch" class="col-span-3 border p-1" placeholder="main" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="git-username" class="text-right text-sm">Username</label>
						<input id="git-username" x-model="gitUsername" class="col-span-3 border p-1" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="git-token" class="text-right text-sm">Token</label>
						<input id="git-token" type="password" x-model="gitToken" class="col-span-3 border p-1" autocomplete="new-password" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="git-cors-proxy" class="text-right text-sm">CORS Proxy</label>
						<input id="git-cors-proxy" x-model="gitCorsProxy" class="col-span-3 border p-1" />
					</div>
				</fieldset>

				<fieldset class="hidden col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm">
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="nostr-private-key" class="text-right">Nostr Key</label>
						<input id="nostr-private-key" type="password" x-model="nostrPrivateKey" class="col-span-3 border p-1" placeholder="nsec..." autocomplete="new-password" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="nostr-relays" class="text-right">Nostr Relays</label>
						<input id="nostr-relays" x-model="nostrRelays" class="col-span-3 border p-1" autocomplete="url" />
					</div>
				</fieldset>

				<fieldset class="hidden col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm">
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="pinata-jwt" class="text-right">Pinata JWT</label>
						<input id="pinata-jwt" type="password" x-model="pinataJwt" class="col-span-3 border p-1" placeholder="JWT Token..." autocomplete="new-password" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="pinata-api-key" class="text-right">Pinata API Key</label>
						<input id="pinata-api-key" x-model="pinataApiKey" class="col-span-3 border p-1" placeholder="API Key..." />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="pinata-secret-key" class="text-right">Pinata Secret</label>
						<input id="pinata-secret-key" type="password" x-model="pinataSecretApiKey" class="col-span-3 border p-1" placeholder="Secret API Key..." autocomplete="new-password" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="ipfs-gateway" class="text-right">IPFS Gateway</label>
						<input id="ipfs-gateway" x-model="ipfsGateway" class="col-span-3 border p-1" placeholder="https://gateway.pinata.cloud/ipfs/" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="use-direct-ipfs" class="text-right">Direct IPFS</label>
						<input id="use-direct-ipfs" type="checkbox" x-model="useDirectIpfs" class="col-span-3 h-4 w-4" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2" x-show="useDirectIpfs">
						<label for="ipfs-root-cid" class="text-right">Root CID</label>
						<input id="ipfs-root-cid" x-model="ipfsRootCid" class="col-span-3 border p-1 bg-gray-100" placeholder="Index File CID..." readonly />
					</div>
					<div class="grid grid-cols-4 items-center gap-2" x-show="useDirectIpfs">
						<label for="disable-ipfs" class="text-right text-orange-600 font-semibold">⚠️ Disable IPFS</label>
						<input id="disable-ipfs" type="checkbox" x-model="disableIPFS" class="col-span-3 h-4 w-4 accent-orange" title="Temporarily disable all IPFS sync operations" />
					</div>
				</fieldset>

				<fieldset class="col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm">
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="ai-api-key" class="text-right">AI API Key</label>
						<input id="ai-api-key" type="password" x-model="aiApiKey" class="col-span-3 border p-1" autocomplete="new-password" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="ai-api-route" class="text-right">AI Endpoint</label>
						<input id="ai-api-route" x-model="aiApiRoute" class="col-span-3 border p-1" autocomplete="url" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="ai-model" class="text-right">AI Model</label>
						<input id="ai-model" x-model="aiModel" class="col-span-3 border p-1" />
					</div>
				</fieldset>

				<fieldset class="col-span-2 lg:col-span-1 grid gap-2 border-t pt-4 text-sm">
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="firebase-config" class="text-right">Firebase JSON</label>
						<textarea id="firebase-config" x-model="firebaseConfig" class="col-span-3 border p-1 h-24 font-mono text-xs" autocomplete="off"></textarea>
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="firebase-vapid-key" class="text-right">VAPID Key</label>
						<input id="firebase-vapid-key" x-model="firebaseVapidKey" class="col-span-3 border p-1" />
					</div>
					<div class="grid grid-cols-4 items-center gap-2">
						<label for="firebase-schedule-url" class="text-right">Schedule URL</label>
						<input id="firebase-schedule-url" x-model="firebaseScheduleUrl" class="col-span-3 border p-1" autocomplete="url" />
					</div>
				</fieldset>

				<!-- Import/Export Modals (Simplified) -->
				<div x-show="showImportModal" class="w-full col-span-2 lg:col-span-1 bg-white p-4 border" style="display: none;">
					<textarea x-model="importString" class="w-full border p-2 mb-2" rows="5" placeholder="Paste settings string..."></textarea>
					<div class="flex justify-end gap-2">
						<button @click="showImportModal = false" class="cursor-pointer border px-4 py-2">Cancel</button>
						<button @click="handleImport()" class="cursor-pointer border px-4 py-2 font-bold">Import</button>
					</div>
				</div>

				<div x-show="showExportModal" class="w-full col-span-2 lg:col-span-1 bg-white p-4 border" style="display: none;">
					<p class="text-sm mb-2">Copy this settings string:</p>
					<textarea readonly x-model="exportString" class="w-full border p-2 mb-2" rows="5"></textarea>
					<div class="flex justify-end gap-2">
						<button @click="showExportModal = false" class="cursor-pointer border px-4 py-2">Close</button>
					</div>
				</div>
			</div>

			<!-- Buttons -->
			<div class="flex justify-end gap-2 mt-4 border-t pt-4">
				<button @click="openImport()" class="cursor-pointer border px-4 py-2">Import</button>
				<button @click="handleExport()" class="cursor-pointer border px-4 py-2">Export</button>
				<button @click="handleSync()" class="cursor-pointer border px-4 py-2" ___disabled="isSyncButtonDisabled">
					<span x-text="isManualSyncing ? 'Syncing...' : 'Sync'"></span>
				</button>
				<button @click="handleSave()" class="cursor-pointer border px-4 py-2 font-bold">
					<span x-text="isSavingSettings ? 'Saving...' : 'Save'"></span>
				</button>
			</div>
		</div>
	</div>
		</div>
	</div>

	<!-- Toasts Container -->
	<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
		<template x-for="toast in toasts" :key="toast.id">
			<div
				x-show="toast.show"
				class="bg-white border p-4 flex items-center justify-between gap-4 max-w-xs"
				:class="{ 'border-2 font-bold': toast.variant === 'error' }"
			>
				<div>
					<h4 class="text-sm font-bold" x-text="toast.title"></h4>
					<p class="text-xs" x-text="toast.description"></p>
				</div>
				<button @click="dismissToast(toast.id)" class="cursor-pointer border px-1 text-xs">X</button>
			</div>
		</template>
	</div>
</body>
